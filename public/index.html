<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#07080f" />

    <title>Shubham Yaduvanshi · AI Software Developer</title>
    <meta
      name="description"
      content="Shubham Yaduvanshi — AI Software Developer and Frontend Engineer in Jaipur with 4+ years building scalable React, Next.js, Node and .NET Core products for insurance and healthcare."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Shubham Yaduvanshi · AI Software Developer" />
    <meta
      property="og:description"
      content="Frontend Engineer crafting fast, scalable, AI-powered interfaces with React, Next.js and .NET Core."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shubham Yaduvanshi · AI Software Developer" />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
